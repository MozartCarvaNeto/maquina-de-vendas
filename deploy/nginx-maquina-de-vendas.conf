# Configuração do Nginx (o "porteiro" que recebe os acessos da internet e
# entrega ao sistema). No servidor, salve em:
#     /etc/nginx/sites-available/maquina
# TROQUE app.seudominio.com.br pelo seu endereço real.
server {
  listen 80;
  server_name app.seudominio.com.br;

  # Permite enviar arquivos de até 100 MB (chat, disparos, listas).
  client_max_body_size 110m;

  location / {
    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;

    # As duas linhas abaixo são ESSENCIAIS: sem elas o tempo real (QR Code,
    # mensagens novas, popup de ligação) não funciona.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
}
